<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Year Calendar</title>
<link rel="apple-touch-icon" href="calendar-icon.png">
<link rel="icon" type="image/png" href="calendar-icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calendar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
/*
VOICE: plain, sturdy wall-planner; a tool you mark up.
IDEA: the one-sheet year planner pinned to an office wall, weekdays lined up in columns.
PICTURE: the full year grid itself, top of the page.
COLOUR and TYPE: white paper, black ink, soft marker fills; Archivo heavy for the year.
LAYOUT: toolbar, then the grid edge to edge, legend beneath; prints on 11x17 landscape.
*/
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#15171a);--ink:light-dark(#111,#eee);--line:light-dark(#cfcfcf,#3a3d42);--wk:light-dark(#efefef,#24272c);--soft:light-dark(#666,#aaa);--panel:light-dark(#f6f6f4,#1e2125)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 Archivo,system-ui,sans-serif;overflow-x:clip}
.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;padding:20px max(3vw,14px) 10px}
h1{margin:0;font-weight:900;font-size:clamp(32px,5vw,52px);line-height:1.05;outline:none}
h1 span{font-weight:500}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
select,button{font:inherit;font-size:16px;min-height:40px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #2b6cff;outline-offset:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px;padding:8px max(3vw,14px) 12px;align-items:center;background:var(--panel);border-block:1px solid var(--line)}
.sw{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 4px;border:2px solid transparent;border-radius:10px;background:var(--bg)}
.sw.on{border-color:var(--ink)}
.sw b{width:30px;height:30px;border-radius:6px;flex:none;cursor:pointer;border:1px solid rgba(0,0,0,.15)}
.sw input{width:136px;font:inherit;font-size:15px;border:0;border-bottom:1px dashed var(--line);background:transparent;color:var(--ink);padding:2px}
.tbtn.on{background:var(--ink);color:var(--bg)}
.hint{color:var(--soft);font-size:13px;width:100%}
.scroll{overflow-x:auto;padding:10px max(3vw,14px) 6px}
table{border-collapse:collapse;width:100%;min-width:1180px;table-layout:fixed;user-select:none}
th,td{border:1px solid var(--line);padding:0}
thead th{font-size:12px;font-weight:700;height:22px;color:var(--soft)}
thead th.we{background:var(--wk)}
th.m{width:52px;font-weight:900;font-size:15px;text-align:center;color:var(--ink)}
td{height:58px;vertical-align:top;position:relative;cursor:crosshair}
td.x{background:repeating-linear-gradient(45deg,transparent 0 5px,var(--wk) 5px 6px);cursor:default}
td.we{background:var(--wk)}
td .d{position:absolute;z-index:1;top:2px;left:4px;font-size:12px;font-weight:700}
td .sp{position:absolute;left:3px;bottom:4px;height:22px;z-index:2;display:flex;align-items:center;padding:0 9px;border-radius:5px;background:var(--ac,#666);font-size:13px;font-weight:700;line-height:1.1;color:#fff;white-space:nowrap;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.18)}
td .sp:hover{outline:2px solid #2b6cff;outline-offset:1px}
td .sp span{overflow:hidden;text-overflow:ellipsis}
td .sp.one{left:1px!important;width:calc(100% - 2px)!important;top:16px;bottom:1px;height:auto;padding:0;background:none;box-shadow:none;color:#111;font-size:8.5px;font-weight:700;white-space:normal;overflow-wrap:anywhere;line-height:1.05;align-items:flex-start;justify-content:center;text-align:center;border-radius:0}
td.sel{outline:2px dashed #2b6cff;outline-offset:-3px}
td.today{box-shadow:inset 0 0 0 2px #2b6cff}
#sync{position:fixed;right:14px;bottom:14px;z-index:4;font-size:12px;color:var(--soft);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap;pointer-events:none}
#sync:empty{display:none}
td .hol{position:absolute;left:3px;right:3px;top:16px;z-index:3;font-size:7.5px;line-height:1.05;font-style:italic;font-weight:600;color:#5b4a8a;overflow:hidden;max-height:24px;hyphens:manual;pointer-events:none}
td.hashol .sp.one{top:38px}
td.dad::after{content:'';position:absolute;inset:0;border:3px solid #0f766e;z-index:1;pointer-events:none}
td.dad.dl::after{border-left:0}td.dad.dr::after{border-right:0}
td.kid::before{content:'';position:absolute;left:0;right:0;top:0;height:16px;background:#d3efe6}
td .d{z-index:1}
.kidtog{display:flex;align-items:center;gap:6px;font-size:14px;padding:0 6px}
.kidtog input{width:18px;height:18px}
.kidtog i{display:inline-block;width:22px;height:12px;border-radius:3px;background:#d3efe6;border:1px solid rgba(0,0,0,.12)}
td.f{color:#111}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px;padding:14px max(3vw,14px) 28px;font-size:12.5px;color:#666}
.lg{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px}
.lg2{padding-left:28px;border-left:1px solid #e2e2de}
.lg span{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.legend i.sq{width:11px;height:11px;border-radius:3px;border:0;margin:0}
.legend i.kl{width:14px;height:3px;border-radius:2px;background:#7fcbb4;border:0;margin:0}
.legend i.dh{width:11px;height:11px;border-radius:3px;border:2px solid #0f766e;background:none;margin:0}
.legend i.hl{width:auto;height:auto;border:0;margin:0;font-size:11px;font-weight:600;color:#5b4a8a;vertical-align:0}
.legend i{display:inline-block;width:16px;height:16px;border-radius:3px;vertical-align:-3px;margin-right:6px;border:1px solid rgba(0,0,0,.15)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:18px;width:min(360px,92vw)}
dialog input{width:100%;font:inherit;font-size:16px;padding:8px;margin:8px 0 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;justify-content:flex-end}
#msg{color:var(--soft);font-size:13px}
#offer{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(560px,94vw);background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:14px 16px;display:none;z-index:5}
#offer.show{display:block}
#offer p{margin:0 0 8px;font-size:14px}
#offer input{width:100%;font:inherit;font-size:16px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);margin-bottom:10px}
#offer .row{flex-wrap:wrap}
#offer .row a{display:inline-flex;align-items:center;min-height:40px;padding:6px 14px;border-radius:8px;background:#1a73e8;color:#fff;text-decoration:none;font-weight:700}
.chk{display:flex;align-items:center;gap:6px;font-size:14px}
.chk input{width:18px;height:18px}
/* ---------- LOOKS ---------- */
/* Clean: quiet grid, thin kid line, slim pills */
:root[data-look=clean]{--line:#e7e7e4;--wk:#f6f6f3}
:root[data-look=clean] h1{font-size:clamp(28px,4vw,40px);letter-spacing:-.02em}
:root[data-look=clean] th,:root[data-look=clean] td{border-color:#ececea}
:root[data-look=clean] td.x{background:#fff;border-color:transparent}
:root[data-look=clean]{--panel:#fff}
:root[data-look=clean] body{background:#fff}
:root[data-look=clean] .top{padding:22px max(3vw,14px) 6px;align-items:center}
:root[data-look=clean] .ctrl select,:root[data-look=clean] .ctrl button{font-size:13px;min-height:32px;padding:4px 10px;border-color:#e3e3e0}
:root[data-look=clean] .ctrl .chk{font-size:12px;color:#777}
:root[data-look=clean] .tools{gap:4px 6px;padding:6px max(3vw,14px) 8px;border-block:0}
:root[data-look=clean] .sw{gap:5px;padding:3px 6px 3px 3px;border-width:1.5px;border-radius:999px}
:root[data-look=clean] .sw b{width:18px;height:18px;border-radius:50%;border:0}
:root[data-look=clean] .sw input{width:auto;field-sizing:content;min-width:40px;font-size:13px;border-bottom:0;padding:0 2px}
:root[data-look=clean] .tbtn{font-size:13px;min-height:30px;padding:3px 10px;border-radius:999px;border-color:#e3e3e0}
:root[data-look=clean] .kidtog{font-size:12px;color:#666;padding:0 4px}
:root[data-look=clean] .kidtog input{width:15px;height:15px}
:root[data-look=clean] td.we{background:#f9f9f7}
:root[data-look=clean] td{height:68px}
:root[data-look=clean] td.f{box-shadow:inset 0 0 0 200px rgba(255,255,255,.38)}
:root[data-look=clean] td.f.today{box-shadow:inset 0 0 0 200px rgba(255,255,255,.38),inset 0 0 0 2px #2b6cff}
:root[data-look=clean] th.m{font-size:13px}
:root[data-look=clean] tbody tr{border-top:2px solid #cfcfcb}
:root[data-look=clean] td .sp.one{font-weight:500;color:#555;font-size:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;bottom:auto;max-height:18px}
:root[data-look=clean] h1{font-weight:300}:root[data-look=clean] h1 span{font-weight:800}
:root[data-look=clean] thead th{font-size:10px;font-weight:600;color:#aaa;height:20px;border-color:transparent}
:root[data-look=clean] thead th.we{background:none}
:root[data-look=clean] td .d{font-size:10.5px;font-weight:600;color:#8a8a86}
:root[data-look=clean] td.f .d{color:#333}
:root[data-look=clean] td.kid::before{height:3px;background:#8fd0bc}
:root[data-look=clean] th.m{font-size:12px;font-weight:800;letter-spacing:.04em;color:#555}
:root[data-look=clean] tr th.m:last-child{display:none}
:root[data-look=clean] td .sp:not(.one){height:16px;bottom:5px;border-radius:999px;font-size:10.5px;font-weight:700;padding:0 8px}
:root[data-look=clean] td.dad::after{border-width:2px}
:root[data-look=clean] td .hol{color:#8a7fb0;font-weight:500}
/* Dark: matches the StayHard homepage */
:root[data-look=dark]{--bg:#0d0d0d;--ink:#eee;--line:#232323;--wk:#151515;--soft:#777;--panel:#111}
:root[data-look=dark] h1{font-family:'Barlow Condensed',Archivo,sans-serif;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
:root[data-look=dark] td.x{background:#0a0a0a}
:root[data-look=dark] td .d{color:#9a9a9a;font-weight:600}
:root[data-look=dark] td.f .d,:root[data-look=dark] td.f{color:#111}
:root[data-look=dark] td.kid::before{height:3px;background:#3fb68b}
:root[data-look=dark] th.m{color:#ddd;font-family:'Barlow Condensed',Archivo,sans-serif;font-size:16px;letter-spacing:.06em}
:root[data-look=dark] tr th.m:last-child{display:none}
:root[data-look=dark] td .hol{color:#b9a8ff}
:root[data-look=dark] td .sp:not(.one){height:17px;bottom:5px;border-radius:4px;font-size:10.5px;background:#f2f2f2;color:#111;box-shadow:none}
:root[data-look=dark] td .sp.one{background:none;color:#eee}:root[data-look=dark] td.f .sp.one{color:#111}
:root[data-look=dark] td.dad::after{border:2px solid #2dd4bf}
:root[data-look=dark] .sw,:root[data-look=dark] select,:root[data-look=dark] button{background:#1a1a1a}
/* Tiles: each day a soft rounded tile, no grid lines */
:root[data-look=tiles]{--gap:4px;--line:transparent;--wk:#f1f0ec}
:root[data-look=tiles] table{border-collapse:separate;border-spacing:4px}
:root[data-look=tiles] th,:root[data-look=tiles] td{border:0}
:root[data-look=tiles] td{border-radius:7px;background:#f8f7f4;height:54px}
:root[data-look=tiles] td.we{background:#efede7}
:root[data-look=tiles] td.x{background:transparent}
:root[data-look=tiles] td .d{font-size:10.5px;font-weight:600;color:#777}
:root[data-look=tiles] td.f .d{color:#222}
:root[data-look=tiles] td.kid::before{left:auto;right:5px;top:5px;width:6px;height:6px;border-radius:50%;background:#3fae8c}
:root[data-look=tiles] th.m{font-size:12px;letter-spacing:.05em;color:#666}
:root[data-look=tiles] tr th.m:last-child{display:none}
:root[data-look=tiles] thead th{height:16px;font-size:10px}
:root[data-look=tiles] td .sp:not(.one){height:16px;bottom:5px;border-radius:999px;font-size:10.5px;padding:0 8px}
:root[data-look=tiles] td.dad::after{border-width:2px;border-radius:7px}
:root[data-look=tiles] td.dad.dl::after{border-radius:0 7px 7px 0}:root[data-look=tiles] td.dad.dr::after{border-radius:7px 0 0 7px}:root[data-look=tiles] td.dad.dl.dr::after{border-radius:0}
:root[data-look=tiles] td.today{box-shadow:inset 0 0 0 2px #2b6cff}
/* Clean tiles: Clean styling on the Tiles layout */
:root[data-variant=tiles]{--gap:4px}
:root[data-variant=tiles] table{border-collapse:separate;border-spacing:4px 5px}
:root[data-variant=tiles] th,:root[data-variant=tiles] td{border:0}
:root[data-variant=tiles] tbody tr{border:0}
:root[data-variant=tiles] td{border-radius:8px;background:#f7f6f3;height:64px;overflow:visible}
:root[data-variant=tiles] td.we{background:#efeee9}
:root[data-variant=tiles] td.x{background:transparent}
:root[data-variant=tiles] td.kid::before{height:3px;left:6px;right:6px;top:0;border-radius:0 0 3px 3px;background:#7fcbb4}
:root[data-variant=tiles] td.dad::after{border-width:2px;border-radius:8px}
:root[data-variant=tiles] td.dad.dl::after{border-radius:0 8px 8px 0}:root[data-variant=tiles] td.dad.dr::after{border-radius:8px 0 0 8px}:root[data-variant=tiles] td.dad.dl.dr::after{border-radius:0}
:root[data-variant=tiles] td.f{box-shadow:inset 0 0 0 200px rgba(255,255,255,.32)}
:root[data-variant=tiles] td .d{top:4px;left:6px}
:root[data-variant=tiles] td .hol{top:18px;left:5px}
:root[data-variant=tiles] thead th{height:16px}
:root[data-variant=tiles] td .sp.one{display:block;-webkit-line-clamp:unset;max-height:none;top:17px;bottom:3px;left:2px!important;width:calc(100% - 4px)!important;font-size:8px;font-weight:600;line-height:1.08;color:#333;text-align:center;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;overflow:hidden}
:root[data-variant=tiles] td.hashol .sp.one{top:36px}
@page{size:17in 11in;margin:.35in}
@media print{
 :root,:root[data-look]{color-scheme:light;--bg:#fff;--ink:#000;--line:#bbb;--wk:#f0f0f0;--soft:#444}
 :root[data-look=dark] h1,:root[data-look=dark] th.m{color:#000}
 body{background:#fff;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .ctrl,.tools,#msg,#offer,#sync{display:none!important}
 .top{padding:0 0 .08in}h1{font-size:30px}
 .scroll{padding:0;overflow:visible}
 table{min-width:0}
 th,td{border-color:#999}
 td{height:.66in}
 thead th{height:.2in;color:#333}
 td.today{box-shadow:none}
 :root[data-look] td{height:.6in!important}
 :root[data-look] .top{padding:0 0 .04in!important}
 .legend{padding-bottom:0!important}
 :root[data-look] td .sp.one{display:flex!important;-webkit-line-clamp:unset;max-height:none!important;bottom:1px!important}
 .legend{padding:.1in 0 0;font-size:11px}
}

td i.ph{position:absolute;left:0;right:0;bottom:0;height:3px;z-index:1;pointer-events:none}
:root[data-variant=tiles] td i.ph{left:6px;right:6px;border-radius:3px 3px 0 0}
.tog i.tr{display:inline-block;width:14px;height:3px;border-radius:2px;background:linear-gradient(90deg,#8fb3d9 0 33%,#f0a35e 33% 66%,#e05d6f 66%)}
.phdefs{flex-basis:100%;margin-top:14px;padding-top:14px;border-top:1px solid #ececea}
.phdefs h2{margin:0 0 10px;font-size:13px;font-weight:700;color:#444}
.phgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 28px}
.phgrid b{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#333}
.phgrid b i{display:inline-block;width:16px;height:3px;border-radius:2px}
.phgrid p{margin:4px 0 0;font-size:12px;line-height:1.45;color:#777;max-width:36ch}
@media print{.phdefs{margin-top:.06in;padding-top:.06in}.phgrid{grid-template-columns:repeat(5,1fr);gap:4px 16px}.phgrid p{font-size:9px;margin-top:1px}.phdefs h2{font-size:10px;margin-bottom:3px}}
/* phase styles */
:root[data-phase=band] td i.ph,:root[data-phase=timeline] td i.ph,:root[data-phase=off] td i.ph{display:none}
tr.phr td.pb{height:15px!important;padding:0;border:0!important;background:transparent!important;position:relative;box-shadow:none!important}
tr.phr th{height:15px;border:0}
.pbs{position:absolute;left:0;top:0;height:15px;line-height:15px;border-radius:4px;font-size:9.5px;font-weight:700;color:#fff;padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2;box-sizing:border-box}
:root[data-variant=tiles] tr.phr td.pb{border-radius:0}
:root[data-phase=wash] td i.ph,:root[data-phase=combo] td i.ph{top:0;bottom:0;left:0;right:0;height:auto;opacity:.22;border-radius:inherit}
:root[data-phase=wash] td.f i.ph,:root[data-phase=combo] td.f i.ph{display:none}
.mph{display:flex;flex-direction:column;gap:2px;margin-top:4px;font-size:9px;font-weight:600;color:#888;letter-spacing:0;align-items:center}
.mph span{display:flex;align-items:center;gap:3px}.mph i{display:inline-block;width:8px;height:3px;border-radius:2px}
#tl{padding:4px max(3vw,14px) 6px}
.tlw{position:relative;height:86px;margin-left:56px}
.tlm,.tlb,.tlr{position:absolute;left:0;right:0}
.tlm{top:0;height:14px;border-bottom:1px solid #ececea}.tlm span{position:absolute;font-size:10px;font-weight:600;color:#aaa;padding-left:3px;border-left:1px solid #e2e2de;height:14px;line-height:14px}
.tlb{top:20px;height:20px}.tlb span{position:absolute;top:0;height:20px;line-height:20px;border-radius:5px;color:#fff;font-size:10.5px;font-weight:700;padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box;border-right:2px solid #fff}
.tlr{top:46px;height:26px}.tlr span{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:9.5px;font-weight:600;color:#c0505d;white-space:nowrap}
.tlr i{width:9px;height:9px;border-radius:50%;background:#e8838c;border:2px solid #fff;box-shadow:0 0 0 1px #e8838c;margin-bottom:2px}
@media print{#tl{padding:0 0 .02in}.tlw{height:.78in}:root[data-phase=band] td,:root[data-phase=combo] td{height:.4in!important}tr.phr td.pb,tr.phr th{height:.14in!important}.pbs{height:.13in;line-height:.13in;font-size:8px}:root[data-variant=tiles] table{border-spacing:3px 3px}thead th{height:12px!important}}
/* ---------- toolbar (key at the top) ---------- */
.tools{display:flex;flex-direction:column;align-items:stretch;gap:10px;padding:10px max(3vw,14px) 14px!important;background:transparent!important;border:0!important}
.grp{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.gl{font-size:11px;color:#999;width:34px;flex:none}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.tools .sw{gap:6px;padding:4px 10px 4px 6px;border:1px solid #e6e6e2;border-radius:999px;background:#fff}
.tools .sw.on{border-color:color-mix(in srgb,var(--c) 70%,#000);background:color-mix(in srgb,var(--c) 22%,#fff)}
.tools .sw b{width:14px;height:14px;border-radius:50%;border:0}
.tools .sw input{width:auto;field-sizing:content;min-width:30px;font-size:13px;border:0;padding:0;background:transparent}
.row2{display:flex;flex-wrap:wrap;gap:10px 40px;align-items:center}
.seg{display:inline-flex;border:1px solid #e6e6e2;border-radius:999px;overflow:hidden;background:#fff}
.seg .tbtn{border:0;border-radius:0;min-height:30px;padding:3px 14px;font-size:13px;background:transparent;color:#444}
.seg .tbtn+.tbtn{border-left:1px solid #ededea}

   for(let i=0;i<37;i++){const d=i-start+1;const k=d>=1&&d<=days?key(m,d):null;const p=k&&PH[k];
    if(!p){h+='<td class="pb"></td>';continue}
    let lab='';if(d===1||PH[key(m,d-1)]!==p){let n=1;while(d+n<=days&&PH[key(m,d+n)]===p)n++;const c=(PHASE[p.type]||PHASE.easy)[0];lab=`<span class="pbs" title="${esc(p.t)} (${nice(p.s)} – ${nice(p.e)})" style="width:calc(${n*100}% + ${n-1} * var(--gap,1px));background:color-mix(in srgb,${c} 80%,#000)">${esc(p.t)}</span>`}
    h+=`<td class="pb">${lab}</td>`}
   h+='<th class="m"></th></tr>'}
 }
 $('cal').innerHTML=h+'</tbody>';
 // ---- mobile: one month at a time, 7-day weeks ----
 const FW={};spans.forEach((sp,idx)=>{let d=new Date(sp.s+'T12:00:00');const E=new Date(sp.e+'T12:00:00');while(d<=E){if(d.getFullYear()===year){const k=d.toISOString().slice(0,10),prev=new Date(d.getTime()-864e5);if(k===sp.s||d.getDay()===0||d.getDate()===1){let n=1,x=new Date(d.getTime()+864e5);while(x<=E&&x.getDay()!==0&&x.getDate()!==1){n++;x=new Date(x.getTime()+864e5)}FW[k]=(FW[k]||'')+spanH(sp,idx,n)}}d=new Date(d.getTime()+864e5)}});
 let mh=`<nav class="mnav">${MONTHS.map((mo,i)=>`<a href="#" data-mm="${i}">${mo[0]+mo.slice(1).toLowerCase()}</a>`).join('')}</nav>`;
 for(let m=0;m<12;m++){const start=new Date(year,m,1).getDay(),days=new Date(year,m+1,0).getDate();
  mh+=`<section class="mm" id="mm-${m}"><h3>${new Date(year,m,1).toLocaleDateString(undefined,{month:'long'})}</h3><table class="mt"><thead><tr>${[...DOW].map((c,i)=>`<th class="${i%6==0?'we':''}">${c}</th>`).join('')}</tr></thead><tbody>`;
  for(let w=0;w*7-start<days;w++){mh+='<tr>';const ks=[];
   for(let i=0;i<7;i++){const d=w*7+i-start+1;if(d<1||d>days){mh+='<td class="x"></td>';ks.push(null);continue}ks.push(d);mh+=cellH(m,d,days,i,FW)}
   mh+='</tr>';
   if(PHS('band')&&showTrn&&ks.some(d=>d&&PH[key(m,d)])){mh+='<tr class="phr">';
    for(let i=0;i<7;i++){const d=ks[i],p=d&&PH[key(m,d)];if(!p){mh+='<td class="pb"></td>';continue}
     let lab='';if(i===0||d===1||PH[key(m,d-1)]!==p){let n=1;while(i+n<7&&ks[i+n]&&PH[key(m,ks[i+n])]===p)n++;const c=(PHASE[p.type]||PHASE.easy)[0];lab=`<span class="pbs" style="width:calc(${n*100}% + ${n-1} * var(--gap,1px));background:color-mix(in srgb,${c} 80%,#000)">${esc(p.t)}</span>`}
     mh+=`<td class="pb">${lab}</td>`}
    mh+='</tr>'}}
  mh+='</tbody></table></section>'}
 $('mcal').innerHTML=mh;
 document.documentElement.dataset.phase=showTrn?phStyle:'off';
 let tl='';if(PHS('timeline')&&showTrn&&phases.length){const N=(Date.UTC(year+1,0,1)-Date.UTC(year,0,1))/864e5,doy=k=>{const [Y,M,D]=k.split('-').map(Number);return (Date.UTC(Y,M-1,D)-Date.UTC(year,0,1))/864e5};
  tl=`<div class="tlw"><div class="tlm">${MONTHS.map((mo,i)=>`<span style="left:${doy(key(i,1))/N*100}%">${mo}</span>`).join('')}</div><div class="tlb">${phases.map(p=>{const c=(PHASE[p.type]||PHASE.easy)[0];return `<span title="${esc(p.t)} (${nice(p.s)} – ${nice(p.e)})" style="left:${doy(p.s)/N*100}%;width:${(doy(p.e)-doy(p.s)+1)/N*100}%;background:color-mix(in srgb,${c} 80%,#000)">${esc(p.t)}</span>`}).join('')}</div><div class="tlr">${spans.filter(sp=>sp.c===2).sort((a,b)=>a.s<b.s?-1:1).map((sp,ri)=>`<span style="left:${(doy(sp.s)+.5)/N*100}%;top:${ri%2?13:0}px"><i></i>${esc(sp.t)}</span>`).join('')}</div></div>`}
 $('tl').innerHTML=tl;
 renderLegend();
}

function apply(td){
 const k=td.dataset.k;if(!k)return;
 const v=data[k]||{};
 if(tool==='kid'){const want=mode==='kid';if(want===autoKid(k))delete v.kid;else v.kid=want;if(!cols(v).length&&v.dad===undefined&&v.kid===undefined)delete data[k];else data[k]=v;needRender=true;return}
 if(tool==='dad'){const want=mode==='dad';if(want===!!AUTO[k])delete v.dad;else v.dad=want;if(!cols(v).length&&v.dad===undefined&&v.kid===undefined)delete data[k];else data[k]=v;needRender=true;return}
 let cs=cols(v);delete v.c;
 if(mode==='erase'){cs=[];const before=spans.length;spans=spans.filter(sp=>k<sp.s||k>sp.e);if(spans.length!==before)needRender=true}
 else if(mode==='remove')cs=cs.filter(c=>c!==paintVal);
 else if(!cs.includes(paintVal)){cs=cs.length>=2?[cs[0],paintVal]:cs.concat(paintVal);if(!stroke.includes(k))stroke.push(k)}
 if(cs.length)v.cs=cs;else delete v.cs;
 if(!cs.length&&v.dad===undefined&&v.kid===undefined)delete data[k];else data[k]=v;
 td.style.background=bgFor(cs);
 td.classList.toggle('f',cs.length>0);
 td.classList.toggle('we',!cs.length&&(td.cellIndex-1)%7%6==0);
}

const cal=$('calwrap');
cal.addEventListener('click',e=>{const a=e.target.closest('[data-mm]');if(!a)return;e.preventDefault();const el=$('mm-'+a.dataset.mm);if(el)el.scrollIntoView({behavior:'smooth',block:'start'})});
window.addEventListener('pointercancel',()=>{if(painting){painting=false;save();if(needRender){needRender=false;render()}}});
cal.addEventListener('pointerdown',e=>{
 const spEl=e.target.closest('.sp');if(spEl){e.preventDefault();const ix=+spEl.dataset.sp,sp=spans[ix];if(sp)openBox(sp.t,[sp.s,sp.e],ix,sp.c);return}
 const td=e.target.closest('td[data-k]');if(!td)return;
 e.preventDefault();
 if(tool==='note'){const k=td.dataset.k,ix=spans.findIndex(sp=>k>=sp.s&&k<=sp.e);if(ix>-1){openBox(spans[ix].t,[spans[ix].s,spans[ix].e],ix);return}selecting=true;stroke=[k];td.classList.add('sel');return}
 const cur=cols(data[td.dataset.k]);
 if(tool==='kid'){mode=isKidK(td.dataset.k)?'unkid':'kid';painting=true;stroke=[];apply(td);return}
 if(tool==='dad'){mode=isDadK(td.dataset.k)?'undad':'dad';painting=true;stroke=[];apply(td);return}
 paintVal=tool==='erase'?null:tool;
 mode=tool==='erase'?'erase':(cur.includes(tool)?'remove':'add');
 painting=true;stroke=[];apply(td);
});
cal.addEventListener('pointerover',e=>{const td=e.target.closest('td[data-k]');if(!td)return;if(painting)apply(td);else if(selecting&&!stroke.includes(td.dataset.k)){stroke.push(td.dataset.k);td.classList.add('sel')}});
let selecting=false;
window.addEventListener('pointerup',()=>{if(painting){painting=false;save();if(needRender){needRender=false;render()}else renderLegend();if(stroke.length&&mode==='add'&&askG){const ks=stroke.slice().sort();openBox(labels[paintVal]||'',[ks[0],ks[ks.length-1]],null,paintVal)}}
 else if(selecting){selecting=false;const ks=stroke.slice().sort();openBox('',[ks[0],ks[ks.length-1]],null,null)}});
const ymd=k=>k.replace(/-/g,'');
function nextDay(k){const [y,m,d]=k.split('-').map(Number);const t=new Date(y,m-1,d+1);return t.getFullYear()+String(t.getMonth()+1).padStart(2,'0')+String(t.getDate()).padStart(2,'0')}
const nice=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'short',day:'numeric'})};
let range=null;let boxColor=null;
function gUrl(){const t=$('offerTitle').value.trim()||'Event';
 return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(t)+'&dates='+ymd(range[0])+'/'+nextDay(range[1])+'&authuser='+encodeURIComponent(GACCT)}
function openBox(title,r,ix,c){
 range=r;edit=ix;boxColor=c;
 const txt=r[0]===r[1]?nice(r[0]):nice(r[0])+' – '+nice(r[1]);
 $('offerTxt').textContent=(ix==null?'Label ':'Edit label for ')+txt+'. It stretches across all of these days.';
 $('offerTitle').value=title;$('offerGo').href=gUrl();
 $('offerDel').style.display=ix==null?'none':'';
 $('offer').classList.add('show');$('offerTitle').focus({preventScroll:true});$('offerTitle').select();
}
function hideOffer(){$('offer').classList.remove('show');document.querySelectorAll('td.sel').forEach(t=>t.classList.remove('sel'))}
function saveLabel(){const t=$('offerTitle').value.trim();if(edit!=null){if(t)spans[edit].t=t;else spans.splice(edit,1)}else if(t)spans.push({s:range[0],e:range[1],t,c:boxColor});save();hideOffer();render()}
$('offerTitle').addEventListener('input',()=>{$('offerGo').href=gUrl()});
$('offerTitle').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();saveLabel()}if(e.key==='Escape')hideOffer()});
$('offerSave').onclick=saveLabel;
$('offerGo').addEventListener('click',()=>setTimeout(saveLabel,200));
$('offerDel').onclick=()=>{if(edit!=null)spans.splice(edit,1);save();hideOffer();render()};
$('offerNo').onclick=hideOffer;
const ag=$('askG');ag.checked=askG;ag.onchange=()=>{askG=ag.checked;store.set('bac-askg',askG);if(!askG)hideOffer()};

$('tools').addEventListener('change',e=>{if(e.target.id==='trn'){showTrn=e.target.checked;store.set('bac-trn',showTrn);render();pushSettings()}if(e.target.id==='dadh'){showDad=e.target.checked;store.set('bac-dad',showDad);render();pushSettings()}if(e.target.id==='hols'){showHol=e.target.checked;store.set('bac-hol',showHol);render();pushSettings()}if(e.target.id==='kids'){showKids=e.target.checked;store.set('bac-kids',showKids);render();pushSettings()}});
$('tools').addEventListener('click',e=>{
 const b=e.target.closest('[data-i]'),t=e.target.closest('[data-t]');
 if(b){tool=+b.dataset.i;renderTools()}
 else if(t){tool=tool===t.dataset.t?0:t.dataset.t;renderTools()}
});
$('tools').addEventListener('keydown',e=>{const b=e.target.closest('[data-i]');if(b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();tool=+b.dataset.i;renderTools()}});
$('tools').addEventListener('input',e=>{const i=e.target.dataset.l;if(i!=null){labels[i]=e.target.value;store.set('bac-labels-v3',labels);renderLegend();pushSettings()}});

ys.onchange=()=>{year=+ys.value;store.set('bac-year',year);load()};
$('title').addEventListener('input',()=>{const tn=$('title').firstChild;if(tn&&tn.nodeType===3){store.set('bac-title',tn.nodeValue.trim());pushSettings()}});
let armed=false;
$('clear').onclick=()=>{if(!armed){armed=true;$('clear').textContent='Click again to clear';setTimeout(()=>{armed=false;$('clear').textContent='Clear year'},3000);return}data={};spans=[];save();render();armed=false;$('clear').textContent='Clear year'};
$('print').onclick=()=>{try{window.print()}catch(e){}$('msg').textContent='If no print dialog opened, use your browser’s Print (Ctrl/Cmd+P). Choose Tabloid / 11×17, Landscape, scale 100%, and turn on “Background graphics.”'};

try{matchMedia('(max-width:700px)').addEventListener('change',()=>render())}catch(e){}
applyLook();renderTools();load();
}
</script>
